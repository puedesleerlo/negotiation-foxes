    name: "Outcome simulator per candidate strategy"
    version: "0.1.0"
    status: implemented
    paper_ids: [hendrikx2012eval, faratin1998nego]
    rubric_score: 17
    estimates: [outcome_distribution, p_impasse]
    phase: prep
    inputs_required: ["own candidate strategy", "samples of θ", "counterpart families"]
    outputs: "Distribution of own utility, joint utility and impasse probability per strategy"
    scope_conditions:
      - "alternating-offers protocol"
      - "the simulated families (Boulware, Conceder, tit-for-tat, hardliner) cover the real counterpart"
    assumptions: ["the counterpart belongs to one of the simulated families"]
    calibration_dataset: data/synthetic/episodes.parquet
    validation_report: foxes/f08_outcome_simulator/validation_report.md
    skill_path: skills/foxes/f08_outcome_simulator
    notes: >-
      Stays `implemented` rather than `validated`: its output is a distribution of outcomes
