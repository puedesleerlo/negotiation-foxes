  - fox_id: f09_hypothesis_issue_weights
    name: "Issue weights by Bayesian update over a hypothesis space"
    version: "0.1.0"
    status: validated
    validation_summary: >-
      Over 616 evaluations, all in scope: CRPS 0.097 (control 0.110) and log score 0.474
      (control 0.427); coverage 50/90 = 0.46/0.90. It is the only weight estimator that beats
      the control on **both** scoring rules, even against a control that is the generating
      distribution of the true weights.
    calibration:
      parameter: sigma
      value_file: skills/foxes/f09_hypothesis_issue_weights/assets/calibration.json
      note: "Dispersion of the Luce likelihood, calibrated for nominal coverage."
    paper_ids: [konishi2026pref, hindriks2008oppo]
    rubric_score: 16
    estimates: [theta.w]
    phase: online
    inputs_required: ["the counterpart's offers", "hypothesis space over weights (discretised simplex)"]
    outputs: "Posterior over the weight vector (weighted hypotheses)"
    scope_conditions:
      - "multi-issue (≥ 2 issues)"
      - "≥ 2 observed offers"
      - "additive utility of the counterpart"
    assumptions:
      - "the counterpart proposes offers of high utility to itself under its true profile"
      - "the hypothesis space discretises the simplex with enough resolution"
      - "sigma (likelihood dispersion) controls the aggressiveness of the update"
    calibration_dataset: data/synthetic/episodes.parquet
    validation_report: foxes/f09_hypothesis_issue_weights/validation_report.md
    skill_path: skills/foxes/f09_hypothesis_issue_weights
    notes: >-
      Second estimator of `w` with a mechanism independent of f02: f02 looks at *how much is
      conceded* per issue between consecutive offers, f09 at *how likely each offer is* under
      each weight hypothesis. Disagreement between them is informative and triggers
      hypotheses (§6.5 rule 4).

