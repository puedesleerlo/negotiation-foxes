  - fox_id: f06_uninformed_prior
    name: "Uninformed prior (control)"
    version: "0.1.1"
    status: validated
    validation_summary: >-
      Nominal coverage verified on the validation split for rv, beta and T. It is the
      reference the others are measured against; its report exists so that it can be stated
      that the declared support contains θ.
    version_note: >-
      0.1.1 keys the sampler on (seed, round, number of observations) so that two calls on the
      same state return the same posterior (REVIEW.md, F6). 0.1.0 drew fresh samples on every
      call, which made the control — and therefore every comparison against it — depend on
      the order of calls.
    paper_ids: []
    rubric_score: 20
    estimates: [theta.rv, theta.w, theta.beta, theta.T]
    phase: both
    inputs_required: ["declared ranges of each issue in case.yaml"]
    outputs: "Uniform posterior over the declared support"
    scope_conditions: ["always applicable"]
    assumptions: ["none beyond the support"]
    calibration_dataset: null
    validation_report: foxes/f06_uninformed_prior/validation_report.md
    skill_path: skills/foxes/f06_uninformed_prior
    notes: >-
      Runs always, in every program and for every parameter. It is never a member of the
      pool: it is the baseline the pool's log score is measured against (REVIEW.md, F7).

  - fox_id: f07_zopa_pareto_estimator
    name: "ZOPA, Pareto frontier and Nash point by Monte Carlo propagation"
    version: "0.1.0"
    status: validated
    validation_summary: >-
      Validated as a propagator, not as an estimator of θ. (a) Correctness: with exact θ the
      mean absolute error over the true ZOPA is 0.0019 (maximum 0.0163, attributable to the
      sampling of the outcome space). (b) Propagation: fed a noisy belief centred on the truth,
      it covers the true value above nominal (0.93-1.00 at 90 %), i.e. it does not
      artificially narrow the uncertainty it receives. The over-coverage reflects that the
      belief injected in the test is deliberately conservative.
    paper_ids: [banks2020adve]
    rubric_score: 18
    estimates: [zopa, pareto_frontier, nash_point, joint_gains]
    phase: both
    inputs_required: ["own declared utility", "samples of the counterpart's θ (from other foxes or the pool)"]
    outputs: "Distribution over the estimated ZOPA, frontier and Nash point"
    scope_conditions: ["additive utilities", "enumerable or sampleable issue space"]
    assumptions: ["the counterpart's utility is additive over the same issues"]
    calibration_dataset: data/synthetic/episodes.parquet
    validation_report: foxes/f07_zopa_pareto_estimator/validation_report.md
    skill_path: skills/foxes/f07_zopa_pareto_estimator
    implementation_plan: "Sample θ, build the counterpart's implied utility, enumerate or
      sample the outcome space, compute frontier, Nash and KS per sample."

