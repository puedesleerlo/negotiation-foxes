[project]
name = "negotiation-foxes"
version = "0.1.0"
description = "E1 — bilateral negotiation system with foxes (calibrated microtheories) on two-sided cases"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "tenacity>=8.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
dash = ["streamlit>=1.36", "plotly>=5.22"]

# The project is used as a set of modules with PYTHONPATH at the root, not as an installable
# package (DECISIONS D-004): there is no [build-system] on purpose.

[tool.pytest.ini_options]
testpaths = ["foxes/tests", "tests"]
addopts = "-q"

[tool.uv]
package = false
